name: Indexed framebuffer

on:
  push:
    paths: &firmware_paths
      - '.github/workflows/indexed-framebuffer.yml'
      - 'shared/IndexedFramebuffer/**'
      - 'compass/**'
      - 'compass-horizon/**'
      - 'dual-gauge-can/**'
      - 'dual-gauge-with-buttons/**'
  pull_request:
    paths: *firmware_paths

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [compass, compass-horizon, dual-gauge-can, dual-gauge-with-buttons]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.2.0
      - run: pio run -d "${{ matrix.project }}"
